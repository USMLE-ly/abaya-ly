<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — نادين</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Tajawal', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(255, 245, 247, 0.7) 0%, #fcfaf8 50%, rgba(255, 245, 247, 0.7) 100%);
        color: #110f0d;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      .code { font-size: 88px; font-weight: 800; color: #c42855; line-height: 1; }
      .title { font-size: 22px; font-weight: 700; margin: 16px 0 8px; }
      .desc { font-size: 15px; color: #6e665c; line-height: 1.8; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 28px;
        border-radius: 12px;
        background: #c42855;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <div class="title">الصفحة غير موجودة</div>
      <div class="desc">يبدو أن الملف أو الصفحة التي تبحثين عنها غير متوفرة.<br />العودي إلى الرئيسية لمواصلة التسوق.</div>
      <a href="/">العودة إلى الرئيسية</a>
    </div>
  </body>
</html>
